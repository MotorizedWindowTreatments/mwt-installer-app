<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MWT Installer</title>

<!-- PWA: installability + "feels like an app" on iOS Home Screen -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16233f">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS-specific: these are what actually make "Add to Home Screen" open
     without Safari's address bar/toolbar (standalone mode) and use our
     icon instead of a screenshot of the page. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MWT Installer">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="offline-banner">No internet connection - you can keep creating, saving, and editing jobs. Submitting requires a connection.</div>

<div id="app-shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">MWT <span>INSTALLER</span></div>
      <div class="sub">Order &amp; Measurement Manager</div>
    </div>
    <div id="sidebar-scroll" class="sidebar-scroll">
      <nav id="sidebar-nav"></nav>
    </div>
    <div id="sidebar-footer" class="sidebar-footer"></div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="menu-btn" class="menu-btn" aria-label="Menu">&#9776;</button>
      <div id="topbar-title" class="title">Dashboard</div>
      <div id="save-indicator" class="save-indicator"></div>
    </header>
    <main id="content"></main>
  </div>
</div>

<div id="toast-host"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="js/config.js"></script>
<script src="js/formSchemas.js"></script>
<script src="js/db.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
<script src="js/itinerary.js"></script>
<script>
  // Registers the offline app-shell cache. Safe to fail silently (e.g.
  // if ever opened directly from a file:// path during testing, where
  // service workers aren't available) - the app still works, just
  // without the offline-shell caching.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.warn("Service worker registration failed (app still works):", err);
      });
    });
  }
</script>
</body>
</html>
